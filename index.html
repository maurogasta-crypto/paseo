<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paseo Primero de Mayo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
    .container { max-width: 960px; margin: 0 auto; }

    /* Cabecera */
    .header-album { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
    .header-album h1 { margin: 0 0 6px 0; color: var(--primary); font-size: 1.8rem; }
    .subtitulo { color: var(--text-muted); font-size: 1.05rem; margin: 0 0 12px 0; }
    .descripcion-extendida { background: var(--card-bg); border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: 4px; color: #cbd5e1; font-size: 0.95rem; }

    /* Secciones y Grilla */
    .seccion-album { margin-bottom: 35px; }
    .seccion-album h2 { font-size: 1.3rem; margin: 0 0 4px 0; color: #f1f5f9; }
    .seccion-desc { color: var(--text-muted); font-size: 0.9rem; margin: 0 0 16px 0; }

    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
    .media-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .media-card:hover { transform: translateY(-3px); border-color: var(--primary); }
    .media-card img { width: 100%; height: 160px; object-fit: cover; display: block; background: #000; }
    
    .media-info { padding: 12px; }
    .media-titulo { font-weight: 600; font-size: 0.9rem; color: var(--text); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .media-fecha { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; display: block; }

    /* Visor Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
    .modal.activo { display: flex; }
    .modal-content { background: var(--card-bg); max-width: 650px; width: 100%; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; position: relative; }
    .modal-content img { width: 100%; max-height: 420px; object-fit: contain; background: #000; display: block; }
    .modal-body { padding: 18px; }
    .close-btn { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 1.6rem; cursor: pointer; border-radius: 50%; width: 36px; height: 36px; line-height: 32px; text-align: center; }

    .visor-seccion { color: var(--primary); font-size: 0.85rem; font-weight: 500; }
    .visor-fecha { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }
    .visor-detalle { color: #cbd5e1; font-size: 0.9rem; margin-top: 10px; line-height: 1.4; border-top: 1px solid var(--border); padding-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <div id="albumHeader">Cargando datos...</div>
    <div id="contenedorSecciones"></div>
  </div>

  <!-- Modal Visor -->
  <div id="visorModal" class="modal" onclick="cerrarVisor()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="cerrarVisor()">&times;</button>
      <img id="visorImg" src="" alt="">
      <div class="modal-body">
        <h3 id="visorTitulo" style="margin:0 0 4px 0; font-size: 1.1rem;"></h3>
        <div id="visorSeccion" class="visor-seccion"></div>
        <div id="visorFecha" class="visor-fecha"></div>
        <div id="visorDetalle" class="visor-detalle"></div>
      </div>
    </div>
  </div>

  <script>
    // Configuración general del proyecto
    const PROJECT_ID = "pruebas-db555";
    
    // Detecta ID desde la URL (?id=xxxx) o usa 'general-flores' por defecto
    const params = new URLSearchParams(window.location.search);
    const albumId = params.get('id') || 'general-flores';

    // Helper: Sanitización de texto
    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Helper: Formateo de fecha
    function formatFecha(strFecha) {
      if (!strFecha) return '';
      const d = new Date(strFecha);
      return isNaN(d) ? esc(strFecha) : d.toLocaleDateString('es-UY', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // Parseo recursivo de JSON REST de Firestore
    function parseFirestoreDoc(fields) {
      if (!fields) return {};
      const obj = {};
      for (let k in fields) {
        const val = fields[k];
        if (val.stringValue !== undefined) obj[k] = val.stringValue;
        else if (val.integerValue !== undefined) obj[k] = Number(val.integerValue);
        else if (val.booleanValue !== undefined) obj[k] = val.booleanValue;
        else if (val.arrayValue !== undefined) {
          obj[k] = (val.arrayValue.values || []).map(v => v.mapValue ? parseFirestoreDoc(v.mapValue.fields) : (v.stringValue || ''));
        } else if (val.mapValue !== undefined) {
          obj[k] = parseFirestoreDoc(val.mapValue.fields);
        }
      }
      return obj;
    }

    async function cargarAlbum() {
      try {
        const res = await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/albumes/${albumId}`);
        if (!res.ok) throw new Error(`No se encontró el álbum '${albumId}'.`);
        
        const doc = await res.json();
        const data = parseFirestoreDoc(doc.fields);
        
        renderHeader(data);
        renderSecciones(data.secciones || []);
      } catch (err) {
        document.getElementById('albumHeader').innerHTML = `
          <div class="header-album">
            <h1>Paseo Primero de Mayo</h1>
            <p class="subtitulo">Servidor conectado correctamente a Firestore (${PROJECT_ID})</p>
            <div class="descripcion-extendida">
              El frontend está listo y funcionando. En cuanto crees el documento <strong>${albumId}</strong> dentro de la colección <strong>albumes</strong> en Firestore, la información se desplegará automáticamente.
            </div>
          </div>`;
      }
    }

    function renderHeader(album) {
      document.getElementById('albumHeader').innerHTML = `
        <div class="header-album">
          <h1>${esc(album.titulo || 'Paseo Primero de Mayo')}</h1>
          ${album.subtitulo ? `<p class="subtitulo">${esc(album.subtitulo)}</p>` : ''}
          ${(album.descripcion || album.detalle) ? `<div class="descripcion-extendida">${esc(album.descripcion || album.detalle)}</div>` : ''}
        </div>
      `;
    }

    function renderSecciones(secciones) {
      const contenedor = document.getElementById('contenedorSecciones');
      contenedor.innerHTML = '';

      // Ordenar secciones por campo 'orden'
      const seccionesOrdenadas = [...secciones].sort((a, b) => (a.orden || 0) - (b.orden || 0));

      seccionesOrdenadas.forEach(s => {
        const secEl = document.createElement('section');
        secEl.className = 'seccion-album';

        // Ordenar medios/archivos por fecha descendente
        const mediosOrdenados = [...(s.medios || [])].sort((a, b) => {
          const fA = new Date(a.creadoEn || a.fecha || 0);
          const fB = new Date(b.creadoEn || b.fecha || 0);
          return fB - fA;
        });

        secEl.innerHTML = `
          <h2>${esc(s.nombre)}</h2>
          ${s.descripcion ? `<p class="seccion-desc">${esc(s.descripcion)}</p>` : ''}
          <div class="media-grid">
            ${mediosOrdenados.map(m => `
              <div class="media-card" onclick="abrirVisor('${esc(m.titulo)}', '${esc(s.nombre)}', '${esc(m.detalle || m.descripcion)}', '${m.creadoEn || m.fecha || ''}', '${m.url}')">
                <img src="${m.urlThumbnail || m.url}" alt="${esc(m.titulo)}" loading="lazy" />
                <div class="media-info">
                  <span class="media-titulo">${esc(m.titulo)}</span>
                  ${(m.creadoEn || m.fecha) ? `<span class="media-fecha">${formatFecha(m.creadoEn || m.fecha)}</span>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        `;
        contenedor.appendChild(secEl);
      });
    }

    function abrirVisor(titulo, seccionNombre, detalle, fecha, url) {
      document.getElementById('visorImg').src = url;
      document.getElementById('visorTitulo').textContent = titulo;
      document.getElementById('visorSeccion').textContent = seccionNombre ? `Sección: ${seccionNombre}` : '';
      document.getElementById('visorFecha').textContent = fecha ? formatFecha(fecha) : '';
      
      const detalleEl = document.getElementById('visorDetalle');
      if (detalle) {
        detalleEl.textContent = detalle;
        detalleEl.style.display = 'block';
      } else {
        detalleEl.style.display = 'none';
      }

      document.getElementById('visorModal').classList.add('activo');
    }

    function cerrarVisor() {
      document.getElementById('visorModal').classList.remove('activo');
    }

    cargarAlbum();
  </script>
</body>
</html>

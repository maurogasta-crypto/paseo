<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - Paseo Primero de Mayo</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --primary: #38bdf8; --text: #f8fafc; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; max-width: 800px; margin: 0 auto; line-height: 1.5; }
    .card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    h2, h3 { color: var(--primary); margin-top: 0; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.85rem; color: var(--primary); }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; padding: 12px 20px; font-weight: bold; margin-top: 15px; border-radius: 6px; cursor: pointer; width: 100%; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .btn-danger { background: #ef4444; width: auto; margin-top: 0; }
    .hidden { display: none !important; }
    .item-sec { background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid var(--border); margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
    #log { font-family: monospace; font-size: 0.85rem; background: #000; padding: 12px; border-radius: 6px; max-height: 200px; overflow-y: auto; color: #4ade80; margin-top: 15px; word-break: break-all; }
  </style>

  <!-- SDKs Compat de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Formulario de Inicio de Sesión -->
  <div id="secLogin" class="card">
    <h2>Acceso Administrador</h2>
    <label>Correo Electrónico</label>
    <input type="email" id="email" placeholder="tu-email@dominio.com">
    <label>Contraseña</label>
    <input type="password" id="pass">
    <button onclick="login()">Iniciar Sesión</button>
  </div>

  <!-- Panel Principal -->
  <div id="secAdmin" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; background:#1e293b; padding:12px; border-radius:6px; border:1px solid #334155;">
      <small>Sesión: <strong id="userEmail" style="color:var(--primary);"></strong></small>
      <button onclick="logout()" class="btn-danger" style="padding:6px 12px;">Cerrar Sesión</button>
    </div>

    <!-- 1. Encabezado del Local -->
    <div class="card">
      <h3>1. Datos Generales del Inmueble</h3>
      <label>Título General</label>
      <input type="text" id="albTitulo">
      <label>Subtítulo</label>
      <input type="text" id="albSubtitulo">
      <label>Descripción del Local / Proyecto</label>
      <textarea id="albDesc" rows="4"></textarea>
      <button onclick="guardarHeader()">Actualizar Datos</button>
    </div>

    <!-- 2. Carga Masiva (Fotos y Videos) -->
    <div class="card">
      <h3>2. Carga Masiva de Fotos y Videos</h3>
      <label>Sección Destino</label>
      <select id="seccionSelect" onchange="toggleNuevaSeccionInput()">
        <!-- Se llena dinámicamente -->
      </select>

      <div id="divNuevaSeccion" class="hidden" style="margin-top: 8px;">
        <label>Nombre de la Nueva Sección</label>
        <input type="text" id="seccionNuevaInput" placeholder="Ej: Showroom, Depósito, Terraza">
      </div>

      <label style="margin-top:12px;">Seleccionar archivos locales (Fotos o Videos)</label>
      <input type="file" id="inputFotos" multiple accept="image/*,video/*">
      <button id="btnSubir" onclick="subirFotosMasivas()">Subir e Integrar al Álbum</button>
      <div id="log" class="hidden"></div>
    </div>

    <!-- 3. Control de Exposición -->
    <div class="card">
      <h3>3. Control de Exposición y Espacios</h3>
      <p style="font-size:0.85rem; color:#94a3b8; margin-top:0;">Oculta o muestra secciones públicamente según disponibilidad:</p>
      <div id="listaSecciones"></div>
    </div>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyAyrHTkm8k2iv_14eQKKCrFyOrgD9mwgHo",
      authDomain: "pruebas-db555.firebaseapp.com",
      projectId: "pruebas-db555",
      storageBucket: "pruebas-db555.firebasestorage.app",
      messagingSenderId: "1009675675879",
      appId: "1:1009675675879:web:eea1f465e6d41b460e5a42"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    // ⚠️ CORRECCIÓN CRÍTICA AQUÍ: El Cloud Name correcto según tu captura
    var CLOUD_NAME = "cwbnaivv"; 
    var UPLOAD_PRESET = "GeneralFlores";
    var ALBUM_ID = "general-flores";

    var currentAlbumData = { titulo: "Paseo Primero de Mayo", subtitulo: "General Flores", descripcion: "", secciones: [] };

    firebase.auth().onAuthStateChanged(function(user) {
      if (user) {
        document.getElementById('secLogin').classList.add('hidden');
        document.getElementById('secAdmin').classList.remove('hidden');
        document.getElementById('userEmail').textContent = user.email;
        cargarEstadoAlbum();
      } else {
        document.getElementById('secLogin').classList.remove('hidden');
        document.getElementById('secAdmin').classList.add('hidden');
      }
    });

    async function login() {
      var email = document.getElementById('email').value.trim();
      var pass = document.getElementById('pass').value;
      if (!email || !pass) return alert("Ingresa tu email y contraseña.");
      try {
        await firebase.auth().signInWithEmailAndPassword(email, pass);
      } catch (e) {
        alert("Error de autenticación: " + e.message);
      }
    }

    function logout() {
      firebase.auth().signOut();
    }

    async function cargarEstadoAlbum() {
      try {
        var docSnap = await firebase.firestore().collection("albumes").doc(ALBUM_ID).get();
        if (docSnap.exists) {
          currentAlbumData = docSnap.data();
          document.getElementById('albTitulo').value = currentAlbumData.titulo || '';
          document.getElementById('albSubtitulo').value = currentAlbumData.subtitulo || '';
          document.getElementById('albDesc').value = currentAlbumData.descripcion || '';
        }
        renderSeccionesAdmin();
      } catch (e) {
        console.error("Error al cargar álbum:", e);
      }
    }

    function renderSeccionesAdmin() {
      var cont = document.getElementById('listaSecciones');
      cont.innerHTML = '';
      (currentAlbumData.secciones || []).forEach(function(s, idx) {
        var div = document.createElement('div');
        div.className = 'item-sec';
        div.innerHTML = `
          <div>
            <strong>${s.nombre}</strong> (${(s.medios || []).length} elementos)
            <br><small style="color:#94a3b8;">Estado: ${s.visible !== false ? '🟢 Visible' : '🔴 Oculto'}</small>
          </div>
          <div>
            <button onclick="toggleVisibilidad(${idx})" style="padding:6px 10px; font-size:0.75rem; width:auto; margin:0 4px 0 0;">${s.visible !== false ? 'Ocultar' : 'Mostrar'}</button>
            <button onclick="borrarSeccion(${idx})" class="btn-danger" style="padding:6px 10px; font-size:0.75rem;">Eliminar</button>
          </div>
        `;
        cont.appendChild(div);
      });

      poblarSelectSecciones();
    }

    function poblarSelectSecciones() {
      var sel = document.getElementById('seccionSelect');
      var valPrevio = sel.value;
      sel.innerHTML = '';

      var secciones = currentAlbumData.secciones || [];
      secciones.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.nombre;
        opt.textContent = s.nombre;
        sel.appendChild(opt);
      });

      var optNueva = document.createElement('option');
      optNueva.value = "__NUEVA__";
      optNueva.textContent = "➕ Crear nueva sección...";
      sel.appendChild(optNueva);

      if (valPrevio && (secciones.some(s => s.nombre === valPrevio) || valPrevio === "__NUEVA__")) {
        sel.value = valPrevio;
      } else if (secciones.length > 0) {
        sel.value = secciones[0].nombre;
      } else {
        sel.value = "__NUEVA__";
      }

      toggleNuevaSeccionInput();
    }

    function toggleNuevaSeccionInput() {
      var sel = document.getElementById('seccionSelect');
      var divNueva = document.getElementById('divNuevaSeccion');
      if (sel.value === "__NUEVA__") {
        divNueva.classList.remove('hidden');
      } else {
        divNueva.classList.add('hidden');
      }
    }

    async function toggleVisibilidad(idx) {
      currentAlbumData.secciones[idx].visible = !(currentAlbumData.secciones[idx].visible !== false);
      await guardarEnFirestore();
      renderSeccionesAdmin();
    }

    async function borrarSeccion(idx) {
      if (confirm("¿Deseas eliminar esta sección y su contenido?")) {
        currentAlbumData.secciones.splice(idx, 1);
        await guardarEnFirestore();
        renderSeccionesAdmin();
      }
    }

    async function guardarHeader() {
      currentAlbumData.titulo = document.getElementById('albTitulo').value;
      currentAlbumData.subtitulo = document.getElementById('albSubtitulo').value;
      currentAlbumData.descripcion = document.getElementById('albDesc').value;
      await guardarEnFirestore();
      alert("Información general actualizada.");
    }

    async function guardarEnFirestore() {
      await firebase.firestore().collection("albumes").doc(ALBUM_ID).set(currentAlbumData, { merge: true });
    }

    async function subirFotosMasivas() {
      var selVal = document.getElementById('seccionSelect').value;
      var seccionNombre = (selVal === "__NUEVA__") ? document.getElementById('seccionNuevaInput').value.trim() : selVal;

      var files = document.getElementById('inputFotos').files;
      if (!seccionNombre || files.length === 0) return alert("Selecciona o escribe la sección y elige al menos un archivo.");

      var btn = document.getElementById('btnSubir');
      btn.disabled = true;
      logMsg(`Iniciando subida de ${files.length} archivo(s) a Cloudinary...`);

      var nuevosMedios = [];
      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        var esVideo = file.type.startsWith('video/');
        
        logMsg(`Subiendo (${i + 1}/${files.length}): ${file.name}...`);
        
        var fd = new FormData();
        fd.append('file', file);
        fd.append('upload_preset', UPLOAD_PRESET);

        try {
          // Usamos el endpoint dinámico
          var endpoint = esVideo ? 'video' : 'image';
          
          var res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${endpoint}/upload`, { 
            method: 'POST', 
            body: fd 
          });
          
          var data = await res.json();
          
          if (data.error) {
            logMsg(`<span style="color:#ef4444;">✗ Error de Cloudinary en ${file.name}: ${data.error.message}</span>`);
            continue; 
          }

          if (data.secure_url) {
            var urlThumb = data.secure_url;
            if (esVideo) {
              urlThumb = data.secure_url.replace(/\.[^/.]+$/, ".jpg");
            } else {
              urlThumb = data.secure_url.replace('/upload/', '/upload/w_400,c_scale/');
            }

            nuevosMedios.push({
              titulo: file.name.replace(/\.[^/.]+$/, ""),
              tipo: esVideo ? 'video' : 'image',
              url: data.secure_url,
              urlThumbnail: urlThumb,
              creadoEn: new Date(file.lastModified).toISOString().split('T')[0],
              detalle: ""
            });
            logMsg(`✓ Éxito: ${file.name}`);
          } else {
            logMsg(`<span style="color:#ef4444;">✗ Error desconocido en ${file.name}</span>`);
          }
        } catch (e) {
          logMsg(`<span style="color:#ef4444;">✗ Error de red en ${file.name}: ${e.message}</span>`);
        }
      }

      if (nuevosMedios.length === 0) {
        logMsg('<span style="color:#ef4444;">No se pudo subir ningún archivo a Cloudinary. Revisa los errores arriba.</span>');
        btn.disabled = false;
        return;
      }

      var secciones = currentAlbumData.secciones || [];
      var secIndex = secciones.findIndex(function(s) { return s.nombre.toLowerCase() === seccionNombre.toLowerCase(); });

      if (secIndex === -1) {
        secciones.push({ nombre: seccionNombre, orden: secciones.length + 1, visible: true, medios: nuevosMedios });
      } else {
        secciones[secIndex].medios = [...(secciones[secIndex].medios || []), ...nuevosMedios];
      }

      currentAlbumData.secciones = secciones;
      await guardarEnFirestore();
      logMsg(`¡Éxito! ${nuevosMedios.length} archivo(s) registrados en Firestore.`);
      renderSeccionesAdmin();
      btn.disabled = false;
      document.getElementById('inputFotos').value = ''; 
    }

    function logMsg(m) {
      var l = document.getElementById('log');
      l.classList.remove('hidden');
      l.innerHTML += `> ${m}<br>`;
      l.scrollTop = l.scrollHeight;
    }
  </script>
</body>
</html>

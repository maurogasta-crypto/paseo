<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Paseo Primero de Mayo · General Flores</title>
<meta name="description" content="Locales y espacios para alquilar en el Paseo Primero de Mayo, General Flores: fotos y videos de cada parte.">
<meta name="theme-color" content="#14342b">
<!--
  index.html — La PORTADA PÚBLICA del paseo. Sello: portada-4 (19-nov-2026)
  · Lee UN documento, albumes/general-flores, por la API REST de Firestore,
    sin SDK y sin sesión: la regla deja `get` a cualquiera y nunca `list`.
    Si gstatic está caído, esto se ve igual.
  · La forma del álbum y las cuentas salen de album.js; no se repiten acá.
  · Sólo dibuja medios de NUESTRA cuenta de Cloudinary (esMedioNuestro).
  · Lo escribe admin.html.
  · portada-2: rediseño visual (portada a pantalla completa, resumen, tarjetas,
    botón de consulta). La lógica de datos y el visor no cambiaron.
  · portada-3: de fondo fijo, en segundo plano y desenfocado, un recorrido lento
    por la fachada del local (fachada-fondo.jpg: foto limpia, sin el poste ni los
    plotters, con persianas). Es sólo CSS; sin JS ni red extra, y quieto con
    «reducir movimiento». fachada.jpg es la misma foto nítida.
  · portada-4: la foto de fondo queda CENTRADA en el edificio principal (posición
    50%, paradas del recorrido corridas +9,6 puntos) y sin las publicidades de los
    vecinos (Levi's y El Clon, borradas de fachada-fondo.jpg).
-->
<style>
  :root { --bg:#f6f2ea; --card:#fffdf8; --linea:#e3dccd; --tinta:#1d2b26; --gris:#5f6b65;
          --verde:#14342b; --verde2:#1f4d3f; --oro:#b98a3e; --ok:#2e7d52; --aviso:#b7791f; --no:#b4443a;
          --serif:Georgia,"Iowan Old Style","Times New Roman",serif; --sombra:0 10px 30px rgba(20,52,43,.10); }
  @media (prefers-color-scheme:dark) {
    :root { --bg:#0f1b17; --card:#16261f; --linea:#27403592; --tinta:#f1ece0; --gris:#a9b5ae;
            --verde:#0b1612; --verde2:#1f4d3f; --oro:#d3a85a; --ok:#5fc08a; --aviso:#e0b04a; --no:#e0776c; --sombra:0 10px 30px rgba(0,0,0,.35); }
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:transparent; color:var(--tinta); line-height:1.6; }

  /* Fondo: recorrido lento por la fachada, desenfocado, detrás de todo */
  .fondo { position:fixed; inset:0; z-index:-1; overflow:hidden; background:var(--verde); pointer-events:none; }
  .fondo .tour { position:absolute; inset:0; background:url("fachada-fondo.jpg") 50% 50%/cover no-repeat; transform-origin:0 0;
                 transform:translate(0%,calc(50% - 50% * 1.2)) scale(1.2); will-change:transform;
                 animation:recorrido 110s ease-in-out infinite; }
  .fondo::after { content:""; position:absolute; inset:0; background:color-mix(in srgb,var(--bg) 70%,transparent); }
  @media (prefers-color-scheme:dark) { .fondo::after { background:color-mix(in srgb,var(--bg) 80%,transparent); } }
  /* El centro de cada parada (x,y en % de la pantalla) y el zoom; se acota para que nunca asome un borde */
  @keyframes recorrido {
    0%,100% { transform:translate(0%,calc(50% - 50% * 1.2)) scale(1.2); }   /* toda la fachada */
    18%     { transform:translate(calc(50% - 45.6% * 1.8),calc(50% - 68% * 1.8)) scale(1.8); }   /* vidrios de planta baja */
    38%     { transform:translate(calc(50% - 55.6% * 1.8),calc(50% - 36% * 1.8)) scale(1.8); }   /* persianas y balcón */
    58%     { transform:translate(calc(50% - 51.6% * 1.8),0%) scale(1.8); }                      /* frontón */
    78%     { transform:translate(calc(50% - 61.6% * 1.8),calc(50% - 66% * 1.8)) scale(1.8); }   /* el pasaje de entrada */
  }
  @media (prefers-reduced-motion:reduce) { .fondo .tour { animation:none; } }
  .cont { max-width:1120px; margin:0 auto; padding:0 18px; }
  a { color:inherit; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:999px; font-weight:600; font-size:.98rem; text-decoration:none; border:1.5px solid transparent; cursor:pointer; font-family:inherit; }
  .btn.p { background:var(--oro); color:#1a1408; } .btn.p:hover { filter:brightness(1.07); }
  .btn.s { border-color:rgba(255,255,255,.55); color:#fff; } .btn.s:hover { background:rgba(255,255,255,.12); }

  /* Portada */
  .hero { position:relative; min-height:min(88vh,720px); display:flex; align-items:flex-end; color:#fff; background:rgba(11,22,18,.45) center/cover no-repeat; cursor:default; }
  .hero::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(11,22,18,.35) 0%,rgba(11,22,18,.15) 35%,rgba(11,22,18,.88) 100%); }
  .hero .cont { position:relative; width:100%; padding-top:90px; padding-bottom:clamp(36px,8vw,72px); }
  .eyebrow { display:inline-block; letter-spacing:.18em; text-transform:uppercase; font-size:.74rem; font-weight:600; color:var(--oro); border:1px solid rgba(211,168,90,.6); padding:5px 12px; border-radius:999px; background:rgba(0,0,0,.25); }
  h1 { font-family:var(--serif); font-weight:700; font-size:clamp(2.2rem,7.5vw,4.4rem); line-height:1.05; margin:16px 0 6px; letter-spacing:-.01em; max-width:14em; }
  .sub { font-family:var(--serif); font-style:italic; font-size:clamp(1.1rem,3vw,1.5rem); margin:0; opacity:.92; }
  .desc { max-width:640px; margin:18px 0 0; font-size:1.05rem; opacity:.92; white-space:pre-wrap; }
  .acciones { display:flex; flex-wrap:wrap; gap:12px; margin-top:26px; }
  .ver-portada { position:absolute; right:18px; top:18px; background:rgba(0,0,0,.35); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:999px; padding:7px 14px; font:inherit; font-size:.82rem; cursor:zoom-in; }

  /* Resumen */
  .resumen { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--linea); border:1px solid var(--linea); border-radius:16px; overflow:hidden; margin:-34px 0 0; position:relative; box-shadow:var(--sombra); }
  .resumen div { background:var(--card); padding:18px 10px; text-align:center; }
  .resumen b { display:block; font-family:var(--serif); font-size:clamp(1.5rem,5vw,2.3rem); color:var(--verde2); line-height:1.1; }
  @media (prefers-color-scheme:dark) { .resumen b { color:var(--oro); } }
  .resumen span { font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gris); }

  /* Navegación */
  nav.partes { position:sticky; top:0; z-index:5; display:flex; gap:8px; overflow-x:auto; padding:12px 18px; margin:26px -18px 0; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--linea); }
  nav.partes a { flex:none; text-decoration:none; border:1px solid var(--linea); background:var(--card); padding:7px 15px; border-radius:999px; font-size:.9rem; white-space:nowrap; }
  nav.partes a:hover { border-color:var(--oro); }

  /* Espacios */
  h2.titulo { font-family:var(--serif); font-size:clamp(1.6rem,4.5vw,2.3rem); margin:46px 0 0; }
  .bajada { color:var(--gris); margin:4px 0 0; }
  section.parte { scroll-margin-top:70px; margin-top:34px; background:var(--card); border:1px solid var(--linea); border-radius:20px; padding:clamp(18px,4vw,32px); box-shadow:var(--sombra); }
  .parte-cab { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
  .parte-cab h3 { margin:0; font-family:var(--serif); font-size:clamp(1.3rem,3.6vw,1.8rem); flex:1 1 auto; }
  .chip { font-size:.78rem; font-weight:600; padding:4px 12px; border-radius:999px; border:1px solid var(--linea); color:var(--gris); white-space:nowrap; }
  .chip.m2 { color:var(--tinta); }
  .chip.disponible { background:color-mix(in srgb,var(--ok) 14%,transparent); border-color:var(--ok); color:var(--ok); }
  .chip.reservado { background:color-mix(in srgb,var(--aviso) 14%,transparent); border-color:var(--aviso); color:var(--aviso); }
  .chip.alquilado { background:color-mix(in srgb,var(--no) 14%,transparent); border-color:var(--no); color:var(--no); }
  .parte-desc { color:var(--gris); white-space:pre-wrap; margin:12px 0 0; max-width:75ch; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr)); gap:12px; margin-top:20px; }
  @media (min-width:760px) { .grid .medio:first-child { grid-column:span 2; grid-row:span 2; } .grid .medio:first-child .img { aspect-ratio:auto; height:100%; min-height:260px; } .grid .medio:first-child { display:flex; flex-direction:column; } .grid .medio:first-child .img { flex:1; } }
  .medio { background:var(--bg); border:1px solid var(--linea); border-radius:14px; overflow:hidden; padding:0; color:inherit; text-align:left; cursor:pointer; font:inherit; transition:transform .2s,box-shadow .2s; }
  .medio:hover { transform:translateY(-3px); box-shadow:var(--sombra); }
  .medio .img { position:relative; aspect-ratio:4/3; background:#000; overflow:hidden; }
  .medio img { width:100%; height:100%; object-fit:cover; display:block; }
  .medio .play { position:absolute; inset:0; display:grid; place-items:center; font-size:2.4rem; color:#fff; text-shadow:0 2px 8px #000; background:rgba(0,0,0,.18); }
  .medio .txt { padding:10px 14px 12px; }
  .medio .t { font-weight:600; font-size:.92rem; margin:0; }
  .medio .d { font-size:.82rem; color:var(--gris); margin:3px 0 0; white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .consultar { margin-top:20px; font-size:.9rem; color:var(--verde2); font-weight:600; text-decoration:none; display:inline-block; }
  @media (prefers-color-scheme:dark) { .consultar { color:var(--oro); } }
  .vacio, .estado { text-align:center; color:var(--gris); padding:36px 16px; border:1px dashed var(--linea); border-radius:14px; margin-top:20px; }

  /* Contacto */
  .contacto { margin-top:56px; background:var(--verde); color:#fff; border-radius:24px; padding:clamp(26px,6vw,52px); text-align:center; }
  .contacto h2 { font-family:var(--serif); font-size:clamp(1.6rem,5vw,2.4rem); margin:0 0 8px; }
  .contacto p { margin:0 auto 22px; max-width:520px; opacity:.9; white-space:pre-wrap; }
  footer { margin:36px 0 40px; text-align:center; color:var(--gris); font-size:.75rem; }

  /* Visor */
  #visor { position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:50; display:none; flex-direction:column; }
  #visor.abierto { display:flex; }
  #visor .escena { flex:1; display:grid; place-items:center; min-height:0; touch-action:pan-y; }
  #visor img, #visor video { max-width:100%; max-height:100%; object-fit:contain; }
  #visor .pie { padding:12px 16px calc(12px + env(safe-area-inset-bottom)); color:#e2e8f0; text-align:center; font-size:.9rem; white-space:pre-wrap; }
  #visor .pie b { display:block; }
  #visor button { position:absolute; background:rgba(30,41,59,.8); color:#fff; border:1px solid #334155; border-radius:999px; width:44px; height:44px; font-size:1.3rem; cursor:pointer; }
  #visor .cerrar { top:calc(12px + env(safe-area-inset-top)); right:12px; }
  #visor .ant { left:8px; top:50%; transform:translateY(-50%); }
  #visor .sig { right:8px; top:50%; transform:translateY(-50%); }
  #visor .num { position:absolute; top:calc(20px + env(safe-area-inset-top)); left:16px; color:#94a3b8; font-size:.85rem; }
  @media (prefers-reduced-motion:no-preference) { html { scroll-behavior:smooth; } }
  @media (prefers-reduced-motion:reduce) { .medio { transition:none; } }
</style>
</head>
<body>
<div class="fondo" aria-hidden="true"><div class="tour"></div></div>
<header class="hero" id="hero">
  <button class="ver-portada" id="verPortada" hidden>⤢ Ver foto</button>
  <div class="cont">
    <span class="eyebrow">Alquiler de espacios · General Flores</span>
    <h1 id="titulo">Paseo Primero de Mayo</h1>
    <p class="sub" id="subtitulo"></p>
    <p class="desc" id="desc"></p>
    <div class="acciones">
      <a class="btn p" href="#espacios">Ver los espacios</a>
      <a class="btn s" href="#contacto" id="btnContacto" hidden>Consultar</a>
    </div>
  </div>
</header>
<div class="cont">
  <div class="resumen" id="resumen" hidden></div>
  <nav class="partes" id="nav" hidden></nav>
  <h2 class="titulo" id="espacios">Espacios para alquilar</h2>
  <p class="bajada">Mirá las fotos y videos de cada parte del paseo.</p>
  <main id="partes"><div class="estado">Cargando…</div></main>
  <div class="contacto" id="contacto" hidden>
    <h2>¿Te interesa un espacio?</h2>
    <p id="contactoTxt"></p>
    <a class="btn p" id="wa" href="#" target="_blank" rel="noopener" hidden>Escribir por WhatsApp</a>
  </div>
  <footer><span id="sello"></span> · <a href="admin.html">administrar</a></footer>
</div>

<div id="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <span class="num" id="vNum"></span>
  <button class="cerrar" id="vCerrar" aria-label="Cerrar">✕</button>
  <div class="escena" id="vEscena"></div>
  <button class="ant" id="vAnt" aria-label="Anterior">‹</button>
  <button class="sig" id="vSig" aria-label="Siguiente">›</button>
  <div class="pie" id="vPie"></div>
</div>

<script type="module">
import * as A from "./album.js";
import { firebaseConfig } from "./firebase-init.js";

const VERSION = "portada-4";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
$("sello").textContent = VERSION + " · " + A.VERSION;

let lista = [], pos = 0;

function abrir(medios, i) {
  lista = medios; pos = i; pintarVisor();
  $("visor").classList.add("abierto"); document.body.style.overflow = "hidden";
}
function cerrar() {
  $("visor").classList.remove("abierto"); $("vEscena").innerHTML = ""; document.body.style.overflow = "";
}
function pintarVisor() {
  const m = lista[pos];
  $("vEscena").innerHTML = m.tipo === "video"
    ? `<video src="${esc(A.grande(m))}" poster="${esc(A.mini(m, 1280))}" controls playsinline autoplay></video>`
    : `<img src="${esc(A.grande(m))}" alt="${esc(m.titulo)}">`;
  $("vPie").innerHTML = (m.titulo ? `<b>${esc(m.titulo)}</b>` : "") + esc(m.detalle || "");
  $("vNum").textContent = lista.length > 1 ? `${pos + 1} / ${lista.length}` : "";
  $("vAnt").hidden = $("vSig").hidden = lista.length < 2;
}
const mover = (p) => { if (lista.length > 1) { pos = (pos + p + lista.length) % lista.length; pintarVisor(); } };
$("vCerrar").onclick = cerrar; $("vAnt").onclick = () => mover(-1); $("vSig").onclick = () => mover(1);
$("visor").addEventListener("click", (e) => { if (e.target.id === "vEscena") cerrar(); });
document.addEventListener("keydown", (e) => {
  if (!$("visor").classList.contains("abierto")) return;
  if (e.key === "Escape") cerrar(); else if (e.key === "ArrowLeft") mover(-1); else if (e.key === "ArrowRight") mover(1);
});
let x0 = null;
$("vEscena").addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
$("vEscena").addEventListener("touchend", (e) => {
  if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 50) mover(dx < 0 ? 1 : -1);
});

// Del texto de contacto saca un teléfono (si hay) para armar el botón de WhatsApp.
function whatsapp(texto) {
  const m = String(texto || "").match(/\+?\d[\d\s().-]{6,}\d/);
  if (!m) return "";
  let d = m[0].replace(/\D/g, "");
  if (!m[0].trim().startsWith("+")) d = d.startsWith("0") ? "598" + d.slice(1) : d;
  return d.length >= 8 ? "https://wa.me/" + d : "";
}

function pintar(a) {
  const titulo = a.titulo || "Paseo Primero de Mayo";
  document.title = [titulo, a.subtitulo].filter(Boolean).join(" · ");
  $("titulo").textContent = titulo;
  $("subtitulo").textContent = a.subtitulo || "";
  $("desc").textContent = a.descripcion || "";
  const p = A.portadaDelAlbum(a);
  if (p) {
    const url = p.tipo === "video" ? A.mini(p, 1600) : A.grande(p);
    $("hero").style.backgroundImage = `url("${url.replace(/"/g, "%22")}")`;
    $("verPortada").hidden = false; $("verPortada").onclick = () => abrir([p], 0);
  }
  if (a.contacto) {
    $("contacto").hidden = false; $("contactoTxt").textContent = a.contacto; $("btnContacto").hidden = false;
    const w = whatsapp(a.contacto); if (w) { $("wa").href = w; $("wa").hidden = false; }
  }
  const secs = A.secciones(a, { soloVisibles: true });
  if (!secs.length) { $("partes").innerHTML = `<div class="vacio">Todavía no hay espacios publicados.</div>`; return; }
  const disp = secs.filter((s) => s.estado === "disponible").length;
  const m2 = secs.reduce((t, s) => t + (typeof s.superficie === "number" ? s.superficie : 0), 0);
  const cifras = [[secs.length, secs.length === 1 ? "Espacio" : "Espacios"], [disp, disp === 1 ? "Disponible" : "Disponibles"]];
  if (m2 > 0) cifras.push([String(Math.round(m2 * 10) / 10).replace(".", ","), "m² en total"]);
  $("resumen").style.gridTemplateColumns = `repeat(${cifras.length},1fr)`;
  $("resumen").innerHTML = cifras.map(([n, t]) => `<div><b>${esc(n)}</b><span>${esc(t)}</span></div>`).join("");
  $("resumen").hidden = false;
  $("nav").hidden = secs.length < 2;
  $("nav").innerHTML = secs.map((s) => `<a href="#p-${esc(s.id)}">${esc(s.nombre)}</a>`).join("");
  $("partes").innerHTML = secs.map((s) => {
    const ms = A.mediosDe(a, s.id), sup = A.superficieTexto(s);
    return `<section class="parte" id="p-${esc(s.id)}">
      <div class="parte-cab"><h3>${esc(s.nombre)}</h3>
        ${sup ? `<span class="chip m2">${esc(sup)}</span>` : ""}
        ${s.estado ? `<span class="chip ${esc(s.estado)}">${esc(A.ESTADOS[s.estado])}</span>` : ""}</div>
      ${s.descripcion ? `<p class="parte-desc">${esc(s.descripcion)}</p>` : ""}
      ${ms.length ? `<div class="grid">${ms.map((m, i) => `<button class="medio" data-s="${esc(s.id)}" data-i="${i}">
          <div class="img"><img src="${esc(A.mini(m, i === 0 ? 960 : 480))}" alt="${esc(m.titulo)}" loading="lazy">${m.tipo === "video" ? `<span class="play">▶</span>` : ""}</div>
          ${m.titulo || m.detalle ? `<div class="txt">${m.titulo ? `<p class="t">${esc(m.titulo)}</p>` : ""}${m.detalle ? `<p class="d">${esc(m.detalle)}</p>` : ""}</div>` : ""}
        </button>`).join("")}</div>` : `<div class="vacio">Esta parte todavía no tiene fotos ni videos.</div>`}
      ${a.contacto && s.estado !== "alquilado" ? `<a class="consultar" href="#contacto">Consultar por este espacio →</a>` : ""}
    </section>`;
  }).join("");
  $("partes").querySelectorAll(".medio").forEach((b) => b.addEventListener("click", () => abrir(A.mediosDe(a, b.dataset.s), Number(b.dataset.i))));
}

async function cargar() {
  const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/albumes/${A.ALBUM_ID}?key=${firebaseConfig.apiKey}`;
  try {
    const r = await fetch(url);
    if (r.status === 404) { $("partes").innerHTML = `<div class="vacio">El catálogo todavía no está publicado.</div>`; return; }
    if (!r.ok) throw new Error(r.status === 403 ? "la base no deja leer el álbum (reglas)" : "la base contestó " + r.status);
    pintar(A.normalizar(A.documentoDeFirestore(await r.json())));
  } catch (e) {
    $("partes").innerHTML = `<div class="estado">No se pudo cargar el catálogo: ${esc(e.message || e)}.<br><button class="btn p" onclick="location.reload()">Reintentar</button></div>`;
  }
}
cargar();
</script>
</body>
</html>

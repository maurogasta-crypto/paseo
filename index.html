<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paseo Primero de Mayo - Catálogo</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --primary: #38bdf8; --text: #f8fafc; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; max-width: 1000px; margin: 0 auto; line-height: 1.5; }
    header { text-align: center; margin-bottom: 40px; }
    h1 { color: var(--primary); margin-bottom: 5px; }
    h2 { color: var(--text); font-weight: normal; font-size: 1.2rem; margin-top: 0; }
    .desc { color: #94a3b8; white-space: pre-wrap; max-width: 800px; margin: 0 auto 30px auto; text-align: justify; }
    
    .seccion-titulo { color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-top: 40px; text-transform: uppercase; font-size: 1.2rem; letter-spacing: 1px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .media-card { background: var(--card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
    .media-card img, .media-card video { width: 100%; height: 200px; object-fit: cover; background: #000; display: block; }
    .media-info { padding: 15px; }
    .media-title { font-weight: bold; font-size: 0.9rem; margin: 0 0 5px 0; word-break: break-word; }
    .media-date { font-size: 0.75rem; color: #94a3b8; }
    
    .loading { text-align: center; color: var(--primary); font-size: 1.2rem; margin-top: 50px; }
    .empty { text-align: center; color: #94a3b8; padding: 40px; border: 1px dashed var(--border); border-radius: 8px; }
  </style>

  <!-- SDKs Compat de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <header>
    <h1 id="tituloAlb">Cargando...</h1>
    <h2 id="subtituloAlb"></h2>
    <div class="desc" id="descAlb"></div>
  </header>

  <div id="contenedorCatalogo">
    <div class="loading">Cargando catálogo...</div>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyAyrHTkm8k2iv_14eQKKCrFyOrgD9mwgHo",
      authDomain: "pruebas-db555.firebaseapp.com",
      projectId: "pruebas-db555",
      storageBucket: "pruebas-db555.firebasestorage.app",
      messagingSenderId: "1009675675879",
      appId: "1:1009675675879:web:eea1f465e6d41b460e5a42"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    var ALBUM_ID = "general-flores";
    var db = firebase.firestore();

    // Escuchar cambios en tiempo real para que si subes algo en admin, se refleje acá
    db.collection("albumes").doc(ALBUM_ID).onSnapshot(function(doc) {
      var cont = document.getElementById('contenedorCatalogo');
      
      if (doc.exists) {
        var data = doc.data();
        document.getElementById('tituloAlb').textContent = data.titulo || "Catálogo";
        document.getElementById('subtituloAlb').textContent = data.subtitulo || "";
        document.getElementById('descAlb').textContent = data.descripcion || "";

        var secciones = data.secciones || [];
        cont.innerHTML = ''; // Limpiar contenedor

        var seccionesVisibles = secciones.filter(function(s) { return s.visible !== false; });

        if (seccionesVisibles.length === 0) {
          cont.innerHTML = '<div class="empty">Aún no hay espacios publicados.</div>';
          return;
        }

        seccionesVisibles.forEach(function(sec) {
          // Título de la sección
          var h3 = document.createElement('h3');
          h3.className = 'seccion-titulo';
          h3.textContent = sec.nombre;
          cont.appendChild(h3);

          // Grid de medios
          var grid = document.createElement('div');
          grid.className = 'grid';

          var medios = sec.medios || [];
          if (medios.length === 0) {
             grid.innerHTML = '<div class="empty" style="grid-column: 1/-1;">Esta sección aún no tiene fotos ni videos.</div>';
          } else {
            medios.forEach(function(m) {
              var card = document.createElement('div');
              card.className = 'media-card';

              var mediaHtml = '';
              if (m.tipo === 'video') {
                // Usamos el thumbnail generado por Cloudinary como "poster" del video
                mediaHtml = `<video src="${m.url}" poster="${m.urlThumbnail}" controls preload="none"></video>`;
              } else {
                // En imágenes usamos la URL original o el thumbnail para cargar más rápido (usamos original en este caso)
                mediaHtml = `<img src="${m.urlThumbnail || m.url}" alt="${m.titulo}" loading="lazy" onclick="window.open('${m.url}', '_blank')">`;
              }

              card.innerHTML = `
                ${mediaHtml}
                <div class="media-info">
                  <p class="media-title">${m.titulo}</p>
                  <span class="media-date">${m.creadoEn || ''}</span>
                </div>
              `;
              grid.appendChild(card);
            });
          }
          cont.appendChild(grid);
        });

      } else {
        cont.innerHTML = '<div class="empty">El catálogo no está disponible.</div>';
      }
    }, function(error) {
      console.error("Error al leer Firestore:", error);
      document.getElementById('contenedorCatalogo').innerHTML = '<div class="empty">Error al cargar los datos.</div>';
    });
  </script>
</body>
</html>

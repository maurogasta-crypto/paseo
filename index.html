<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Paseo Primero de Mayo · General Flores</title>
<meta name="description" content="Locales y espacios para alquilar en el Paseo Primero de Mayo, General Flores: fotos y videos de cada parte.">
<meta name="theme-color" content="#0f172a">
<!--
  index.html — La PORTADA PÚBLICA del paseo. Sello: portada-1 (31-oct-2026)
  · Lee UN documento, albumes/general-flores, por la API REST de Firestore,
    sin SDK y sin sesión: la regla deja `get` a cualquiera y nunca `list`.
    Si gstatic está caído, esto se ve igual.
  · La forma del álbum y las cuentas salen de album.js; no se repiten acá.
  · Sólo dibuja medios de NUESTRA cuenta de Cloudinary (esMedioNuestro).
  · Lo escribe admin.html.
-->
<style>
  :root { --bg:#0f172a; --card:#1e293b; --linea:#334155; --acento:#38bdf8; --texto:#f8fafc; --gris:#94a3b8;
          --ok:#22c55e; --aviso:#f59e0b; --no:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--texto); line-height:1.5; }
  .cont { max-width:1100px; margin:0 auto; padding:0 16px 48px; }
  header { padding:24px 0 8px; text-align:center; }
  h1 { color:var(--acento); margin:0; font-size:clamp(1.6rem,5vw,2.4rem); }
  .sub { margin:4px 0 0; color:var(--texto); opacity:.85; font-size:1.1rem; }
  .hero { width:100%; aspect-ratio:16/9; max-height:520px; object-fit:cover; border-radius:12px; border:1px solid var(--linea); margin:16px 0; background:#000; cursor:zoom-in; display:block; }
  .desc { color:#cbd5e1; white-space:pre-wrap; max-width:800px; margin:0 auto 16px; }
  nav.partes { position:sticky; top:0; z-index:5; background:rgba(15,23,42,.94); backdrop-filter:blur(6px); display:flex; gap:8px; overflow-x:auto; padding:10px 0; margin:0 -16px; padding-left:16px; padding-right:16px; border-bottom:1px solid var(--linea); }
  nav.partes a { flex:none; color:var(--texto); text-decoration:none; border:1px solid var(--linea); background:var(--card); padding:6px 12px; border-radius:999px; font-size:.9rem; white-space:nowrap; }
  nav.partes a:hover { border-color:var(--acento); }
  section.parte { scroll-margin-top:64px; margin-top:32px; }
  .parte-cab { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 12px; border-bottom:2px solid var(--linea); padding-bottom:8px; }
  .parte-cab h2 { margin:0; color:var(--acento); font-size:1.25rem; }
  .chip { font-size:.78rem; padding:2px 10px; border-radius:999px; border:1px solid var(--linea); color:var(--gris); }
  .chip.disponible { border-color:var(--ok); color:var(--ok); }
  .chip.reservado { border-color:var(--aviso); color:var(--aviso); }
  .chip.alquilado { border-color:var(--no); color:var(--no); }
  .parte-desc { color:#cbd5e1; white-space:pre-wrap; margin:10px 0 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr)); gap:12px; margin-top:14px; }
  .medio { background:var(--card); border:1px solid var(--linea); border-radius:8px; overflow:hidden; padding:0; color:inherit; text-align:left; cursor:pointer; font:inherit; }
  .medio .img { position:relative; aspect-ratio:4/3; background:#000; }
  .medio img { width:100%; height:100%; object-fit:cover; display:block; }
  .medio .play { position:absolute; inset:0; display:grid; place-items:center; font-size:2.4rem; text-shadow:0 2px 8px #000; }
  .medio .txt { padding:10px 12px; }
  .medio .t { font-weight:600; font-size:.92rem; margin:0; }
  .medio .d { font-size:.82rem; color:#cbd5e1; margin:4px 0 0; white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .vacio, .estado { text-align:center; color:var(--gris); padding:40px 16px; border:1px dashed var(--linea); border-radius:8px; margin-top:24px; }
  .contacto { margin-top:40px; padding:16px; background:var(--card); border:1px solid var(--linea); border-radius:8px; white-space:pre-wrap; }
  footer { margin-top:40px; text-align:center; color:var(--gris); font-size:.75rem; }
  footer a { color:var(--gris); }
  /* El visor */
  #visor { position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:50; display:none; flex-direction:column; }
  #visor.abierto { display:flex; }
  #visor .escena { flex:1; display:grid; place-items:center; min-height:0; touch-action:pan-y; }
  #visor img, #visor video { max-width:100%; max-height:100%; object-fit:contain; }
  #visor .pie { padding:12px 16px calc(12px + env(safe-area-inset-bottom)); color:#e2e8f0; text-align:center; font-size:.9rem; white-space:pre-wrap; }
  #visor .pie b { display:block; }
  #visor button { position:absolute; background:rgba(30,41,59,.8); color:#fff; border:1px solid var(--linea); border-radius:999px; width:44px; height:44px; font-size:1.3rem; cursor:pointer; }
  #visor .cerrar { top:calc(12px + env(safe-area-inset-top)); right:12px; }
  #visor .ant { left:8px; top:50%; transform:translateY(-50%); }
  #visor .sig { right:8px; top:50%; transform:translateY(-50%); }
  #visor .num { position:absolute; top:calc(20px + env(safe-area-inset-top)); left:16px; color:var(--gris); font-size:.85rem; }
  @media (prefers-reduced-motion:no-preference) { html { scroll-behavior:smooth; } }
</style>
</head>
<body>
<div class="cont">
  <header>
    <h1 id="titulo">Paseo Primero de Mayo</h1>
    <p class="sub" id="subtitulo">General Flores</p>
  </header>
  <img id="hero" class="hero" alt="" hidden>
  <p class="desc" id="desc"></p>
  <nav class="partes" id="nav" hidden></nav>
  <main id="partes"><div class="estado">Cargando…</div></main>
  <div class="contacto" id="contacto" hidden></div>
  <footer><span id="sello"></span> · <a href="admin.html">administrar</a></footer>
</div>

<div id="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <span class="num" id="vNum"></span>
  <button class="cerrar" id="vCerrar" aria-label="Cerrar">✕</button>
  <div class="escena" id="vEscena"></div>
  <button class="ant" id="vAnt" aria-label="Anterior">‹</button>
  <button class="sig" id="vSig" aria-label="Siguiente">›</button>
  <div class="pie" id="vPie"></div>
</div>

<script type="module">
import * as A from "./album.js";
import { firebaseConfig } from "./firebase-init.js";

const VERSION = "portada-1";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
$("sello").textContent = VERSION + " · " + A.VERSION;

let lista = [], pos = 0;

function abrir(medios, i) {
  lista = medios; pos = i; pintarVisor();
  $("visor").classList.add("abierto"); document.body.style.overflow = "hidden";
}
function cerrar() {
  $("visor").classList.remove("abierto"); $("vEscena").innerHTML = ""; document.body.style.overflow = "";
}
function pintarVisor() {
  const m = lista[pos];
  $("vEscena").innerHTML = m.tipo === "video"
    ? `<video src="${esc(A.grande(m))}" poster="${esc(A.mini(m, 1280))}" controls playsinline autoplay></video>`
    : `<img src="${esc(A.grande(m))}" alt="${esc(m.titulo)}">`;
  $("vPie").innerHTML = (m.titulo ? `<b>${esc(m.titulo)}</b>` : "") + esc(m.detalle || "");
  $("vNum").textContent = lista.length > 1 ? `${pos + 1} / ${lista.length}` : "";
  $("vAnt").hidden = $("vSig").hidden = lista.length < 2;
}
const mover = (p) => { if (lista.length > 1) { pos = (pos + p + lista.length) % lista.length; pintarVisor(); } };
$("vCerrar").onclick = cerrar; $("vAnt").onclick = () => mover(-1); $("vSig").onclick = () => mover(1);
$("visor").addEventListener("click", (e) => { if (e.target.id === "vEscena") cerrar(); });
document.addEventListener("keydown", (e) => {
  if (!$("visor").classList.contains("abierto")) return;
  if (e.key === "Escape") cerrar(); else if (e.key === "ArrowLeft") mover(-1); else if (e.key === "ArrowRight") mover(1);
});
let x0 = null;
$("vEscena").addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
$("vEscena").addEventListener("touchend", (e) => {
  if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 50) mover(dx < 0 ? 1 : -1);
});

function pintar(a) {
  document.title = [a.titulo || "Paseo Primero de Mayo", a.subtitulo].filter(Boolean).join(" · ");
  $("titulo").textContent = a.titulo || "Paseo Primero de Mayo";
  $("subtitulo").textContent = a.subtitulo || "";
  $("desc").textContent = a.descripcion || "";
  const p = A.portadaDelAlbum(a);
  if (p) { $("hero").src = p.tipo === "video" ? A.mini(p, 1600) : A.grande(p); $("hero").alt = a.titulo || ""; $("hero").hidden = false; $("hero").onclick = () => abrir([p], 0); }
  const secs = A.secciones(a, { soloVisibles: true });
  $("contacto").hidden = !a.contacto; $("contacto").textContent = a.contacto || "";
  if (!secs.length) { $("partes").innerHTML = `<div class="vacio">Todavía no hay espacios publicados.</div>`; return; }
  $("nav").hidden = secs.length < 2;
  $("nav").innerHTML = secs.map((s) => `<a href="#p-${esc(s.id)}">${esc(s.nombre)}</a>`).join("");
  $("partes").innerHTML = secs.map((s) => {
    const ms = A.mediosDe(a, s.id), sup = A.superficieTexto(s);
    return `<section class="parte" id="p-${esc(s.id)}">
      <div class="parte-cab"><h2>${esc(s.nombre)}</h2>
        ${s.estado ? `<span class="chip ${esc(s.estado)}">${esc(A.ESTADOS[s.estado])}</span>` : ""}
        ${sup ? `<span class="chip">${esc(sup)}</span>` : ""}</div>
      ${s.descripcion ? `<p class="parte-desc">${esc(s.descripcion)}</p>` : ""}
      ${ms.length ? `<div class="grid">${ms.map((m, i) => `<button class="medio" data-s="${esc(s.id)}" data-i="${i}">
          <div class="img"><img src="${esc(A.mini(m))}" alt="${esc(m.titulo)}" loading="lazy">${m.tipo === "video" ? `<span class="play">▶</span>` : ""}</div>
          ${m.titulo || m.detalle ? `<div class="txt">${m.titulo ? `<p class="t">${esc(m.titulo)}</p>` : ""}${m.detalle ? `<p class="d">${esc(m.detalle)}</p>` : ""}</div>` : ""}
        </button>`).join("")}</div>` : `<div class="vacio">Esta parte todavía no tiene fotos ni videos.</div>`}
    </section>`;
  }).join("");
  $("partes").querySelectorAll(".medio").forEach((b) => b.addEventListener("click", () => abrir(A.mediosDe(a, b.dataset.s), Number(b.dataset.i))));
}

async function cargar() {
  const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/albumes/${A.ALBUM_ID}?key=${firebaseConfig.apiKey}`;
  try {
    const r = await fetch(url);
    if (r.status === 404) { $("partes").innerHTML = `<div class="vacio">El catálogo todavía no está publicado.</div>`; return; }
    if (!r.ok) throw new Error(r.status === 403 ? "la base no deja leer el álbum (reglas)" : "la base contestó " + r.status);
    pintar(A.normalizar(A.documentoDeFirestore(await r.json())));
  } catch (e) {
    $("partes").innerHTML = `<div class="estado">No se pudo cargar el catálogo: ${esc(e.message || e)}.<br><button onclick="location.reload()">Reintentar</button></div>`;
  }
}
cargar();
</script>
</body>
</html>

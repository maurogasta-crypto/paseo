<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargador Masivo de Fotos - Paseo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.9rem; color: #38bdf8; }
    input, select { width: 100%; padding: 10px; margin-top: 6px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; padding: 12px 20px; width: 100%; font-weight: bold; margin-top: 20px; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #log { font-family: monospace; font-size: 0.85rem; background: #000; padding: 12px; border-radius: 6px; max-height: 200px; overflow-y: auto; color: #4ade80; margin-top: 15px; }
  </style>
</head>
<body>

  <h2>Carga Masiva de Fotos</h2>
  
  <div class="card">
    <label>1. Nombre en Cloudinary (Cloud Name)</label>
    <input type="text" id="cloudName" placeholder="ej: tu_nombre_cloudinary">

    <label>2. Upload Preset (Unsigned)</label>
    <input type="text" id="uploadPreset" placeholder="ej: ml_default">

    <label>3. Sección donde guardar en el Álbum</label>
    <input type="text" id="seccionNombre" value="Planta Baja">

    <label>4. Selecciona todas las fotos locales</label>
    <input type="file" id="inputFotos" multiple accept="image/*">

    <button id="btnSubir" onclick="subirMasivo()">Iniciar Carga Masiva</button>
  </div>

  <div id="log" style="display:none;"></div>

  <script>
    const PROJECT_ID = "pruebas-db555";
    const ALBUM_ID = "general-flores";

    function logMsg(msg) {
      const log = document.getElementById('log');
      log.style.display = 'block';
      log.innerHTML += `> ${msg}<br>`;
      log.scrollTop = log.scrollHeight;
    }

    async function subirMasivo() {
      const cloudName = document.getElementById('cloudName').value.trim();
      const uploadPreset = document.getElementById('uploadPreset').value.trim();
      const seccion = document.getElementById('seccionNombre').value.trim();
      const files = document.getElementById('inputFotos').files;

      if (!cloudName || !uploadPreset || files.length === 0) {
        alert("Por favor completa los datos de Cloudinary y selecciona al menos una foto.");
        return;
      }

      const btn = document.getElementById('btnSubir');
      btn.disabled = true;
      logMsg(`Iniciando carga de ${files.length} archivos...`);

      const nuevosMedios = [];

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        logMsg(`Subiendo (${i + 1}/${files.length}): ${file.name}...`);

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', uploadPreset);

        try {
          // Subida directa a Cloudinary
          const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();

          if (data.secure_url) {
            nuevosMedios.push({
              titulo: file.name.replace(/\.[^/.]+$/, ""), // Nombre sin extensión
              url: data.secure_url,
              urlThumbnail: data.secure_url.replace('/upload/', '/upload/w_400,c_scale/'),
              creadoEn: new Date(file.lastModified).toISOString().split('T')[0], // Fecha original del archivo
              detalle: ""
            });
            logMsg(`✓ Éxito: ${file.name}`);
          } else {
            logMsg(`✗ Error al subir ${file.name}`);
          }
        } catch (err) {
          logMsg(`✗ Error de red en ${file.name}`);
        }
      }

      if (nuevosMedios.length > 0) {
        logMsg("Guardando lista de fotos en Firestore...");
        await guardarEnFirestore(seccion, nuevosMedios);
      }

      btn.disabled = false;
    }

    async function guardarEnFirestore(seccionNombre, listaMedios) {
      const urlDoc = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/albumes/${ALBUM_ID}`;
      
      try {
        // 1. Obtener documento actual
        const res = await fetch(urlDoc);
        let docData = { secciones: [] };
        
        if (res.ok) {
          const json = await res.json();
          docData = parseDoc(json.fields);
        }

        // 2. Insertar o actualizar la sección
        let secciones = docData.secciones || [];
        let secIndex = secciones.findIndex(s => s.nombre.toLowerCase() === seccionNombre.toLowerCase());

        if (secIndex === -1) {
          secciones.push({
            nombre: seccionNombre,
            orden: secciones.length + 1,
            descripcion: "",
            medios: listaMedios
          });
        } else {
          secciones[secIndex].medios = [...(secciones[secIndex].medios || []), ...listaMedios];
        }

        // 3. Convertir a formato REST de Firestore y guardar
        const payload = {
          fields: {
            titulo: { stringValue: docData.titulo || "Paseo Primero de Mayo" },
            subtitulo: { stringValue: docData.subtitulo || "General Flores" },
            descripcion: { stringValue: docData.descripcion || "" },
            secciones: {
              arrayValue: {
                values: secciones.map(s => ({
                  mapValue: {
                    fields: {
                      nombre: { stringValue: s.nombre },
                      orden: { integerValue: s.orden || 1 },
                      descripcion: { stringValue: s.descripcion || "" },
                      medios: {
                        arrayValue: {
                          values: (s.medios || []).map(m => ({
                            mapValue: {
                              fields: {
                                titulo: { stringValue: m.titulo || "" },
                                url: { stringValue: m.url || "" },
                                urlThumbnail: { stringValue: m.urlThumbnail || m.url || "" },
                                creadoEn: { stringValue: m.creadoEn || "" },
                                detalle: { stringValue: m.detalle || "" }
                              }
                            }
                          }))
                        }
                      }
                    }
                  }
                }))
              }
            }
          }
        };

        const updateRes = await fetch(urlDoc, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (updateRes.ok) {
          logMsg("¡PROCESO FINALIZADO! Fotos registradas en Firestore.");
          alert("Fotos cargadas y guardadas correctamente.");
        } else {
          logMsg("Error al guardar en Firestore.");
        }

      } catch (err) {
        logMsg("Error al conectar con Firestore: " + err.message);
      }
    }

    function parseDoc(fields) {
      if (!fields) return {};
      const obj = {};
      for (let k in fields) {
        const val = fields[k];
        if (val.stringValue !== undefined) obj[k] = val.stringValue;
        else if (val.integerValue !== undefined) obj[k] = Number(val.integerValue);
        else if (val.arrayValue !== undefined) {
          obj[k] = (val.arrayValue.values || []).map(v => v.mapValue ? parseDoc(v.mapValue.fields) : (v.stringValue || ''));
        } else if (val.mapValue !== undefined) {
          obj[k] = parseDoc(val.mapValue.fields);
        }
      }
      return obj;
    }
  </script>
</body>
</html>
